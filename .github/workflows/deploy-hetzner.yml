name: Deploy to Hetzner

# Separate from deploy.yml (GitHub Pages, unchanged) - this deploys the
# self-hosted jellyflow.xyz/Leagues instance. See docs/deployment.md
# section 11 for the one-time server-side setup this depends on (a
# dedicated `deploy` user + SSH key, shared with the JellyFlow repo).
#
# Split into separate named steps (rather than one big SSH script) so a
# failure is immediately visible as *which* stage broke in the Actions UI,
# and so GitHub Actions stops automatically before any later, dependent
# step runs (each `uses: appleboy/ssh-action` step below fails the job on
# a non-zero exit from its script - `set -e` inside each script ensures the
# first failing command is what actually produces that exit code).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hetzner-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code and build frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_DEPLOY_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/rs3-site
            git pull
            # Before anything is rebuilt: server/Dockerfile copies individual
            # files out of src/, so an import added under server/src that
            # reaches a file not on that list produces an image that builds
            # cleanly and then dies on boot with ERR_MODULE_NOT_FOUND - taking
            # every /api/* route down, not just the new feature. `set -e` makes
            # this abort the deploy while the current containers are still
            # untouched, which degrades to "still running yesterday's code"
            # rather than "API is down". Needs no npm install: plain Node, no
            # dependencies. See server/scripts/check-docker-copies.mjs.
            node server/scripts/check-docker-copies.mjs
            npm ci
            npm run build

      # Runs before the stack is rebuilt, on purpose - new application code
      # that depends on a new column/table must never start against a
      # database that doesn't have it yet. A failure here stops the job
      # immediately: the currently-running containers are left untouched,
      # so a broken migration degrades to "still running yesterday's code"
      # rather than "half-deployed and broken".
      #
      # The `docker compose restart postgrest` after migrate.js is required,
      # not cosmetic: PostgREST loads its schema into memory once at
      # startup and has no way to know migrate.js just added a column/
      # function directly against Postgres, underneath it. Skipping this
      # is exactly what caused a real outage - every request touching a
      # post-migration-004/005 column or function (short link creation,
      # analytics tracking) failed with PGRST202/PGRST204 "not found in
      # the schema cache" until postgrest was manually restarted.
      - name: Run database migrations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_DEPLOY_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/rs3-site/deploy
            docker compose up -d postgres postgrest
            docker compose run --rm --no-deps --build node node scripts/migrate.js
            docker compose restart postgrest

      - name: Deploy updated stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_DEPLOY_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/rs3-site/deploy
            docker compose up -d --build

      - name: Reload Caddy routing
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_DEPLOY_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cp /opt/rs3-site/deploy/Caddyfile.snippet /opt/caddy-shared/conf.d/leagues.caddy
            cd /opt/livekit
            docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
