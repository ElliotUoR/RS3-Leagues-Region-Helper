# RS3 Leagues Region Helper - backend stack.
#
# Runs alongside the existing LiveKit/Caddy stack on the same Hetzner box.
# Deliberately does NOT run its own Caddy - the existing production Caddy
# (from The Garage's .prodserver/livekit setup) is extended with a new site
# block (see deploy/Caddyfile.snippet) that reverse-proxies to the
# containers here by name, over the shared external `web` network.
# See docs/deployment.md for the full one-time setup steps.
#
# Usage (from this directory, on the server):
#   cp .env.example .env              # fill in real secrets first
#   docker compose up -d
#   docker compose logs -f

# Explicit project name - without this, Compose defaults to the current
# directory's basename ("deploy"), which collides with any other project
# whose compose file also lives in a directory named "deploy" (e.g.
# JellyFlow's). That collision previously caused `docker compose up` here to
# recreate/disrupt JellyFlow's containers since Compose tracks containers by
# project+service label, not by container_name.
name: rs3-leagues

services:
  postgres:
    image: postgres:16-alpine
    container_name: rs3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rs3
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - rs3_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v14.5
    container_name: rs3_postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_AUTHENTICATOR_PASSWORD}@postgres:5432/rs3
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
    networks:
      - internal
      - web

  node:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: rs3_node
    restart: unless-stopped
    depends_on:
      - postgrest
    environment:
      PORT: 3000
      POSTGREST_URL: http://postgrest:3000
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO: ${GITHUB_REPO}
      ANALYTICS_SALT_SECRET: ${ANALYTICS_SALT_SECRET}
      PAGES_ORIGIN: ${PAGES_ORIGIN}
      # Low-privilege role for the daily analytics rollup job + admin stats
      # API (see docs/deployment.md and deploy/migrations/002_analytics_rollup.sql).
      ANALYTICS_DATABASE_URL: postgres://analytics:${ANALYTICS_DB_PASSWORD}@postgres:5432/rs3
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      # Superuser connection, only actually used when this container is run
      # as a one-off via `docker compose run ... node scripts/migrate.js`
      # (see .github/workflows/deploy-hetzner.yml) - harmless to always set,
      # the long-running server process itself never reads it.
      DATABASE_URL: postgres://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/rs3
    networks:
      - internal
      - web

  frontend:
    image: nginx:alpine
    container_name: rs3_frontend
    restart: unless-stopped
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web

networks:
  internal:
    name: rs3_internal
  web:
    external: true

volumes:
  rs3_postgres_data:
    name: rs3_postgres_data
    external: true
