# SPA fallback for the frontend container - without this, nginx's default
# config 404s on any path that isn't a literal file (e.g. /s/CODE short
# links, see App.jsx's client-side resolution), since there's no such file
# under dist/. try_files falls back to index.html for anything unmatched,
# letting the app's own JS take over routing for that path instead.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
